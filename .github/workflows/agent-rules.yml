# Падает, если CLAUDE.md, AGENTS.md или деревья навыков разошлись с источником в .rulesync/.
# Исправление: npx --yes rulesync@16.24.0 generate и коммит результата.
name: agent-rules

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes rulesync@16.24.0 generate --check
